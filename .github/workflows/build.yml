name: Build iTouch 27 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip iTouch27_Android_Project.zip -d source

      - name: Fix Java and Kotlin targets
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' source/app/build.gradle.kts
          sed -i 's/"1.8"/"17"/g' source/app/build.gradle.kts
          cat >> source/app/build.gradle.kts <<'EOF'

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iTouch27-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
