name: Build iTouch 27 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

- name: Extract project
  run: |
    mkdir -p source
    ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
    if [ -z "$ZIP_FILE" ]; then
      echo "No ZIP file found"
      exit 1
    fi
    unzip "$ZIP_FILE" -d source
      - name: Force Java 17
        run: |
          cat > jvm17.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd source
          gradle -I ../jvm17.init.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iTouch27-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
